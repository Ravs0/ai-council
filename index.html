<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <title>AI Council</title>
    <meta name="description"
        content="AI Council — Multi-model AI reasoning platform with Oracle, Council, and Tolke modes">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="app">
        <!-- SIDEBAR (desktop + mobile overlay) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="logo-dot"></span>
                AI Council
            </div>

            <div class="sidebar-section-label">Modes</div>

            <button class="mode-btn active" data-mode="direct" type="button">
                <span class="mode-icon">⚡</span> Direct
            </button>
            <button class="mode-btn" data-mode="oracle" type="button">
                <span class="mode-icon">🔮</span> Oracle
            </button>
            <button class="mode-btn" data-mode="council" type="button">
                <span class="mode-icon">👥</span> Council
            </button>
            <button class="mode-btn" data-mode="tolke" type="button">
                <span class="mode-icon">🧠</span> Tolke
            </button>
            <button class="mode-btn" data-mode="synthesis" type="button">
                <span class="mode-icon">🏛️</span> Synthesis
            </button>
            <button class="mode-btn" data-mode="editor" type="button">
                <span class="mode-icon">📝</span> Editor
            </button>

            <div class="sidebar-spacer"></div>

            <div class="sidebar-footer">
                <div id="auth-container">
                    <button class="sidebar-btn" id="login-btn" type="button">
                        <span class="btn-icon">🔑</span> Login
                    </button>
                    <div id="user-info" class="hidden">
                        <span id="user-email"></span>
                        <button class="sidebar-btn" id="logout-btn" type="button">
                            <span class="btn-icon">🚪</span> Logout
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-panel">
            <!-- Mobile mode bar (hidden on desktop) -->
            <nav class="mobile-mode-bar">
                <button class="mode-btn active" data-mode="direct" type="button">Direct</button>
                <button class="mode-btn" data-mode="oracle" type="button">Oracle</button>
                <button class="mode-btn" data-mode="council" type="button">Council</button>
                <button class="mode-btn" data-mode="tolke" type="button">Tolke</button>
                <button class="mode-btn" data-mode="synthesis" type="button">Synthesis</button>
                <button class="mode-btn" data-mode="editor" type="button">Editor</button>
            </nav>

            <!-- TOP BAR -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger-btn" id="hamburger-btn" type="button" title="Menu">☰</button>
                    <div>
                        <div class="topbar-mode-label" id="mode-label">Direct</div>
                        <div class="topbar-mode-desc" id="mode-desc">Single model, direct response</div>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="voice-btn" id="voice-btn" type="button" title="Voice (Sarvam AI)">🎤</button>
                    <button class="new-chat-btn" id="new-chat-btn" type="button">+ New Chat</button>
                </div>
            </header>

            <!-- CONTEXT BAR -->
            <section class="context-bar">
                <div class="context-group" data-for="direct">
                    <select id="direct-model"></select>
                </div>

                <div class="context-group hidden" data-for="oracle">
                    <select id="oracle-mode">
                        <option value="auto">Auto</option>
                        <option value="swift">Swift</option>
                        <option value="full">Full</option>
                    </select>
                </div>

                <div class="context-group hidden" data-for="council">
                    <select id="council-persona"></select>
                </div>

                <div class="context-group hidden" data-for="tolke">
                    <select id="tolke-model"></select>
                </div>

                <div class="context-group hidden" data-for="editor">
                    <span class="label">SuperDoc Editor</span>
                </div>
            </section>

            <!-- CHAT -->
            <section class="chat-panel">
                <div class="chat-feed" id="chat-feed"></div>
                <details class="trace-panel hidden" id="oracle-trace-wrap">
                    <summary>Oracle Trace</summary>
                    <div id="oracle-trace"></div>
                </details>
                <div id="editor-container" class="editor-container hidden"></div>
            </section>

            <!-- COMPOSER -->
            <section class="composer">
                <textarea id="chat-input" rows="1" placeholder="Type your message..."></textarea>
                <button class="send-btn" id="send-btn" type="button">Send</button>
            </section>
        </div>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
