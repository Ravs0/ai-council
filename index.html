<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Council</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <main class="app">
        <header class="topbar">
            <div class="topbar-left">
                <button class="ghost-btn" id="new-chat-btn" type="button">New Chat</button>
            </div>
            <div class="topbar-center">AI Council</div>
            <div class="topbar-right" id="mode-label">Direct</div>
        </header>

        <section class="mode-bar" id="mode-bar" aria-label="Modes">
            <button class="mode-btn active" data-mode="direct" type="button">Direct</button>
            <button class="mode-btn" data-mode="oracle" type="button">Oracle</button>
            <button class="mode-btn" data-mode="council" type="button">Council</button>
            <button class="mode-btn" data-mode="tolke" type="button">Tolke</button>
        </section>

        <section class="context-bar">
            <div class="context-group" data-for="direct">
                <select id="direct-model"></select>
            </div>

            <div class="context-group hidden" data-for="oracle">
                <select id="oracle-mode">
                    <option value="auto">Auto</option>
                    <option value="swift">Swift</option>
                    <option value="full">Full</option>
                </select>
            </div>

            <div class="context-group hidden" data-for="council">
                <select id="council-persona"></select>
            </div>

            <div class="context-group hidden" data-for="tolke">
                <select id="tolke-model"></select>
            </div>
        </section>

        <section class="chat-panel">
            <div class="chat-feed" id="chat-feed"></div>
            <details class="trace-panel hidden" id="oracle-trace-wrap">
                <summary>Oracle Trace</summary>
                <div id="oracle-trace"></div>
            </details>
        </section>

        <section class="composer">
            <textarea id="chat-input" rows="2" placeholder="Type your message..."></textarea>
            <button id="send-btn" type="button">Send</button>
        </section>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
